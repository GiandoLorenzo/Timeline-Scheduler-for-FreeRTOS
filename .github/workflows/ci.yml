name: Build and regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s Tools/tests -v
      - run: python3 Tools/scheduler_generator.py -c Tools/system_config.json -o Tools/generated_main.c
      - run: git diff --exit-code -- Tools/generated_main.c
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm make
      - name: Build and run selected scenario
        shell: bash
        run: |
          if [ "${{ matrix.test }}" = 0 ]; then
            project=DemoPriority
          else
            project=DemoTest
          fi
          make -C "$project" all EXTRA_CFLAGS="-DTEST_NUMBER=${{ matrix.test }}"
          python3 Tools/run_qemu_test.py --project "$project" --test "${{ matrix.test }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: qemu-test-${{ matrix.test }}
          path: artifacts/
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make
      - run: make -C Demo all
      - run: python3 Tools/scheduler_generator.py -c Tools/system_config.json -o Demo/generated_main.c
      - run: make -C Demo clean && make -C Demo all MAIN_SOURCE=generated_main.c
